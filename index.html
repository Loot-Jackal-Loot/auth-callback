<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOT JACKAL LOOT! - LOGIN</title>
<!-- Landing page of the OAuth redirect: nothing to index or share. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1a30">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/web/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/web/icon-192.png">
<link rel="apple-touch-icon" href="/assets/web/icon-180.png">

<link rel="stylesheet" href="/assets/site.css">
<style>
  .login { text-align: center; padding: 48px 0 32px; }
  .logo {
    display: block;
    width: min(100%, 320px);
    height: auto;
    margin: 0 auto 24px;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.55));
  }
  .login .panel { max-width: 520px; margin: 0 auto; }
  .login h1 {
    margin: 0 0 12px;
    font: 24px/1.4 "M41 Lovebit", "Space Mono", monospace;
    color: var(--gold);
  }
  .login.failed h1 { color: #ff6b6b; }
  @media (max-width: 480px) {
    .login { padding-top: 32px; }
    .logo { width: min(100%, 240px); }
    .login h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <main class="login" id="login">
    <img class="logo" src="/assets/logo.png" width="600" height="400" alt="LOOT JACKAL LOOT!">
    <div class="panel">
      <h1 id="msg">Authenticating…</h1>
      <p id="sub"></p>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL  = "https://ctpbuwqycdbekzumlrrh.supabase.co"
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cGJ1d3F5Y2RiZWt6dW1scnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDE5NTEsImV4cCI6MjA5OTYxNzk1MX0.AHmjaEJFRkwJ-70sgvE4_1OGCOSJPg-ExhSscCKck-o"

  function show(title, text, failed) {
    document.getElementById("msg").textContent = title
    document.getElementById("sub").textContent = text
    document.getElementById("login").classList.toggle("failed", failed)
  }

  async function main() {
    const hash   = new URLSearchParams(window.location.hash.slice(1))
    const search = new URLSearchParams(window.location.search)
    const access_token  = hash.get("access_token")
    const refresh_token = hash.get("refresh_token")
    const state         = search.get("polling_state")

    if (!access_token || !state) {
      show("Authentication failed.", "Missing token or state. Please try again from the game.", true)
      return
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/store-auth-tokens`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON },
        body: JSON.stringify({ state, access_token, refresh_token }),
      })
      if (!res.ok) {
        // The server refused the tokens: the game would wait for a login that never arrives.
        show("Authentication failed.", "Please try again from the game.", true)
        return
      }
      show("Authentication successful!", "You can close this tab and return to the game.", false)
    } catch (e) {
      show("Authentication failed.", "Could not reach server. Please try again.", true)
    }
  }

  main()
</script>
</body>
</html>
